[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "warehouse-robot-navigation"
version = "2.0.0"
description = "Assignment II: Production-grade warehouse robot navigation system"
authors = [
    { name = "Group 101 - Donald Johnson A, Sanchi Jain, Brijesh Pandey, Gochhayat Avimanyu" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-p no:launch_testing_ros -p no:ament_pep257 -p no:ament_lint -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint"
